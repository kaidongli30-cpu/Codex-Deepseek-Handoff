name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Node tests
        run: npm test
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Test isolated install and uninstall layout
        shell: pwsh
        run: ./scripts/test-install-layout.ps1
